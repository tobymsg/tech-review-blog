<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모바일 — 테크픽</title>
<meta name="description" content="모바일 비교·추천 가이드 모음">
<meta property="og:title" content="모바일 — 테크픽">
<meta property="og:description" content="모바일 비교·추천 가이드 모음">
<meta property="og:type" content="website">
<link rel="canonical" href="https://tobymsg.github.io/tech-review-blog/c/mobile/">
<style>
:root{--canvas:#010102;--s1:#0f1011;--s2:#141516;--hair:#23252a;--ink:#f7f8f8;--mut:#d0d6e0;--sub:#8a8f98;--acc:#5e6ad2;--acc-h:#828fff}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--canvas);color:var(--ink);font:17px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:var(--acc);text-decoration:none}a:hover{color:var(--acc-h)}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header.site{border-bottom:1px solid var(--hair)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.logo small{color:var(--sub);font-weight:400;margin-left:8px;font-size:13px}
nav.cats a{color:var(--sub);font-size:14px;margin-left:14px}
main{padding:36px 0 64px}
.disclosure{background:var(--s1);border:1px solid var(--hair);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--sub);margin:0 0 24px}
.disclosure b{color:var(--mut);font-weight:500}
h1{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin-bottom:12px}
.meta{color:var(--sub);font-size:13.5px;margin-bottom:28px}
.meta .dot{margin:0 8px;opacity:.5}
.summary{background:var(--s1);border:1px solid var(--hair);border-radius:10px;padding:18px 20px;margin-bottom:32px}
.summary h2{font-size:14px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.summary ul{list-style:none}.summary li{padding:4px 0;color:var(--mut)}
.summary li::before{content:'—';color:var(--acc);margin-right:8px}
article h2{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:36px 0 12px}
article h3{font-size:17.5px;font-weight:600;margin:28px 0 10px}
article p{color:var(--mut);margin:0 0 16px}
article ul,article ol{margin:0 0 16px 22px;color:var(--mut)}
article blockquote{border-left:2px solid var(--acc);padding:2px 0 2px 14px;color:var(--sub);margin:0 0 16px}
article code{background:var(--s2);border:1px solid var(--hair);border-radius:4px;padding:1px 5px;font-size:.85em}
article pre{background:var(--s1);border:1px solid var(--hair);border-radius:8px;padding:14px;overflow:auto;margin-bottom:16px}
article pre code{border:0;background:none}
.table-wrap{overflow-x:auto;margin:0 0 20px;border:1px solid var(--hair);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:480px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--hair);color:var(--mut);white-space:nowrap}
th{color:var(--ink);font-weight:600;background:var(--s1);position:sticky;left:0}
tr:last-child td{border-bottom:0}
.evi{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--sub);border:1px solid var(--hair);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.buybox{background:var(--s1);border:1px solid var(--hair);border-radius:12px;padding:20px;margin:36px 0}
.buybox h2{font-size:16px;margin:0 0 4px}
.buybox .checked{font-size:12.5px;color:var(--sub);margin-bottom:14px}
.btns{display:flex;flex-direction:column;gap:8px}
.btn{display:flex;align-items:center;justify-content:space-between;border-radius:8px;padding:12px 16px;font-size:15px;font-weight:500}
.btn.primary{background:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc-h);color:#fff}
.btn.ghost{border:1px solid var(--hair);color:var(--mut)}
.btn.ghost:hover{border-color:var(--acc);color:var(--ink)}
.btn .price{font-size:13px;opacity:.8;font-weight:400}
.related{margin-top:44px;border-top:1px solid var(--hair);padding-top:24px}
.related h2{font-size:15px;color:var(--sub);font-weight:600;margin-bottom:12px}
.related a{display:block;padding:9px 0;color:var(--mut);border-bottom:1px solid var(--hair)}
.related a:last-child{border-bottom:0}
/* ── 홈페이지 ── */
.hero{padding:48px 0 40px;text-align:center}
.hero h1{font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-bottom:12px}
.hero p{color:var(--sub);font-size:16px;max-width:420px;margin:0 auto 28px;line-height:1.6}
.cat-pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.cat-pills a{padding:6px 16px;border-radius:99px;border:1px solid var(--hair);font-size:13px;color:var(--sub);transition:all .15s}
.cat-pills a:hover{border-color:var(--acc);color:var(--ink);background:var(--s1)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:48px 0 20px}
.section-head h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.section-head a{font-size:13px;color:var(--sub)}
.post-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:560px){.post-grid{grid-template-columns:1fr 1fr}}
.post-card{display:block;background:var(--s1);border:1px solid var(--hair);border-radius:14px;padding:24px;transition:border-color .15s,transform .15s}
.post-card:hover{border-color:var(--acc);transform:translateY(-2px)}
.post-card .cat-badge{display:inline-block;font-size:11.5px;font-weight:600;color:var(--acc);border:1px solid var(--hair);border-radius:99px;padding:2px 10px;margin-bottom:12px}
.post-card .t{font-weight:600;font-size:18px;letter-spacing:-.01em;line-height:1.3;margin-bottom:8px;color:var(--ink)}
.post-card .d{font-size:13.5px;color:var(--sub);line-height:1.5;margin-bottom:12px}
.post-card .meta{font-size:12.5px;color:var(--sub)}
.post-featured{grid-column:1/-1;display:block;background:var(--s1);border:1px solid var(--hair);border-radius:16px;padding:32px;transition:border-color .15s}
.post-featured:hover{border-color:var(--acc)}
.post-featured .cat-badge{display:inline-block;font-size:11.5px;font-weight:600;color:var(--acc);border:1px solid var(--hair);border-radius:99px;padding:2px 10px;margin-bottom:16px}
.post-featured .t{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin-bottom:10px;color:var(--ink)}
.post-featured .d{font-size:15px;color:var(--mut);line-height:1.6;margin-bottom:16px}
.post-featured .meta{font-size:13px;color:var(--sub)}
.divider{height:1px;background:var(--hair);margin:48px 0}
/* 기존 cardlist (카테고리 페이지용) */
.cardlist a.card{display:block;background:var(--s1);border:1px solid var(--hair);border-radius:10px;padding:18px 20px;margin-bottom:12px}
.cardlist a.card:hover{border-color:var(--acc)}
.cardlist .t{font-weight:600;color:var(--ink);letter-spacing:-.01em;margin-bottom:4px}
.cardlist .d{font-size:13.5px;color:var(--sub)}
footer{border-top:1px solid var(--hair);color:var(--sub);font-size:13px;padding:20px 0 40px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
h1.page{margin-bottom:24px}
.empty{color:var(--sub);text-align:center;padding:48px 0}
@media(max-width:480px){.hero h1{font-size:30px}article{font-size:16px}.post-card .t{font-size:16px}}
</style>

</head>
<body>
<header class="site"><div class="wrap">
<a class="logo" href="../../">테크픽<small>사야 할 이유와 제외된 이유, 한 화면에</small></a>
<nav class="cats"><a href="../../c/notebook/">노트북</a><a href="../../c/mobile/">모바일</a><a href="../../c/gear/">주변기기</a><a href="../../c/home/">가전</a></nav>
</div></header>
<main><div class="wrap">
<h1 class="page">모바일</h1>
<p class="empty">아직 글이 없습니다.</p>
<p><a href="../../">← 홈</a></p>
</div></main>
<footer><div class="wrap">
<span>© 테크픽</span><span>이 포스팅은 제휴마케팅 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</span>
</div></footer>
</body>
</html>
